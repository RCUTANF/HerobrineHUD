name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MC ${{ matrix.minecraft-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft-version: "26.1"
            gradle-project: ":fabric"
            artifact-dir: "fabric/build/libs"
          - minecraft-version: "1.21.11"
            gradle-project: ":fabric-remap"
            artifact-dir: "fabric-remap/build/libs"
          - minecraft-version: "1.21.4"
            gradle-project: ":fabric-remap"
            artifact-dir: "fabric-remap/build/libs"
          - minecraft-version: "1.21.1"
            gradle-project: ":fabric-remap"
            artifact-dir: "fabric-remap/build/libs"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew ${{ matrix.gradle-project }}:build -PdebugVersion=${{ matrix.minecraft-version }} --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: herobrinehud-mc-${{ matrix.minecraft-version }}
          path: |
            ${{ matrix.artifact-dir }}/*.jar
            !${{ matrix.artifact-dir }}/*-sources.jar
            !${{ matrix.artifact-dir }}/*-dev.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Extract release notes
        id: extract_release_notes
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "VERSION is empty" >&2
            exit 1
          fi

          esc_version=$(printf '%s' "$VERSION" | sed 's/[][\.*^$(){}?+|/]/\\&/g')
          esc_tag=$(printf '%s' "$TAG" | sed 's/[][\.*^$(){}?+|/]/\\&/g')

          body=$(perl -0777 -ne 'if(/^##\s+(?:\['"$esc_version"'\]|'"$esc_version"'|\['"$esc_tag"'\]|'"$esc_tag"')(?:\s.*)?\r?\n(.*?)(?=^##\s+|\z)/sms){print $1}' CHANGELOG.md || true)
          body=$(printf '%s' "$body" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          if [ -z "$body" ]; then
            body=$(perl -0777 -ne 'if(/^##\s+Unreleased(?:\s.*)?\r?\n(.*?)(?=^##\s+|\z)/sms){print $1}' CHANGELOG.md || true)
            body=$(printf '%s' "$body" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          fi

          if [ -z "$body" ]; then
            echo "Could not find release notes for $TAG or Unreleased in CHANGELOG.md" >&2
            exit 1
          fi

          delim="EOF_$(date +%s%N)"
          echo "body<<$delim" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$body" >> "$GITHUB_OUTPUT"
          echo "$delim" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.extract_release_notes.outputs.body }}
          files: release-artifacts/*.jar
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
