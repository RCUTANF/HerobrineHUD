name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MC ${{ matrix.minecraft-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft-version: "26.1"
            gradle-project: ":fabric"
            artifact-dir: "fabric/build/libs"
          - minecraft-version: "1.21.11"
            gradle-project: ":fabric-remap"
            artifact-dir: "fabric-remap/build/libs"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew ${{ matrix.gradle-project }}:build -PdebugVersion=${{ matrix.minecraft-version }} --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: herobrinehud-mc-${{ matrix.minecraft-version }}
          path: |
            ${{ matrix.artifact-dir }}/*.jar
            !${{ matrix.artifact-dir }}/*-sources.jar
            !${{ matrix.artifact-dir }}/*-dev.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_notes: ${{ steps.extract_release_notes.outputs.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Extract release notes
        id: extract_release_notes
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ]; then
            echo "GITHUB_REF_NAME is empty" >&2
            exit 1
          fi

          body=$(
            awk -v tag="$TAG" '
              /^##[[:space:]]+/ {
                heading = $0
                sub(/^##[[:space:]]+/, "", heading)
                if (found) {
                  exit
                }
                found = (heading == tag)
                next
              }

              found {
                print
              }
            ' CHANGELOG.md
          )
          body=$(printf '%s' "$body" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          if [ -z "$body" ]; then
            echo "Could not find release notes for $TAG in CHANGELOG.md. Expected heading: ## $TAG" >&2
            exit 1
          fi

          delim="EOF_$(date +%s%N)"
          echo "body<<$delim" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$body" >> "$GITHUB_OUTPUT"
          echo "$delim" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.extract_release_notes.outputs.body }}
          files: release-artifacts/*.jar
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-modrinth:
    name: Publish Modrinth MC ${{ matrix.minecraft-version }}
    needs:
      - build
      - release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft-version: "26.1"
            minecraft-label: "26.1.x"
            artifact-name: "herobrinehud-mc-26.1"
            version-suffix: "mc26.1"
            game-versions: |
              26.1
              26.1.1
              26.1.2
          - minecraft-version: "1.21.11"
            minecraft-label: "1.21.11"
            artifact-name: "herobrinehud-mc-1.21.11"
            version-suffix: "mc1.21.11"
            game-versions: "1.21.11"

    steps:
      - name: Validate Modrinth config
        shell: bash
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$MODRINTH_PROJECT_ID" ]; then
            echo "::error::Set repository variable MODRINTH_PROJECT_ID to your Modrinth project slug or id."
            exit 1
          fi

          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::Set repository secret MODRINTH_TOKEN to a Modrinth token with version creation permissions."
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: modrinth-artifacts

      - name: Publish Modrinth version
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          files: modrinth-artifacts/*.jar
          name: HerobrineHUD ${{ github.ref_name }} for Minecraft ${{ matrix.minecraft-label }}
          version: ${{ github.ref_name }}-${{ matrix.version-suffix }}
          version-type: ${{ contains(github.ref_name, 'alpha') && 'alpha' || (contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc')) && 'beta' || 'release' }}
          changelog: ${{ needs.release.outputs.release_notes }}
          loaders: fabric
          game-versions: ${{ matrix.game-versions }}
          game-version-filter: none
          dependencies: |
            fabric-api(required)
            fabric-language-kotlin(required)
          java: Java 25
